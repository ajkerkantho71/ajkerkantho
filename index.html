<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আজকের কন্ঠ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hind Siliguri',sans-serif;background:linear-gradient(135deg,#071423,#0b1f36,#08111d);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff;overflow:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.45}
body:before{width:260px;height:260px;background:#2563eb;top:-80px;left:-80px}
body:after{width:220px;height:220px;background:#06b6d4;right:-60px;bottom:-60px}
.card{width:min(1100px,100%);background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.top{text-align:center;margin-bottom:18px}
.logo{width:90px;height:90px;object-fit:contain;border-radius:50%;background:#fff;padding:6px}
h1{font-size:2rem}
.sub{color:#cbd5e1}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sec{background:rgba(255,255,255,.05);border-radius:20px;padding:16px}
.sec h2{margin-bottom:12px;color:#7dd3fc;font-size:1.3rem}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;padding:12px;border-radius:14px;font-weight:600}
.y{background:#cc0000}.f{background:#1877f2}.g{background:#16a34a}.i{background:#c13584}.x{background:#111827}.gr{background:#6d28d9}
@media(max-width:800px){
body{overflow:auto}
.wrap,.links{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="card">
<div class="top">
<img src="logo.png" class="logo" alt="Logo">
<h1>আজকের কন্ঠ</h1>
<div class="sub">Official Link Hub</div>
</div>

<div class="wrap">
<div class="sec">
<h2>দৈনিক আজকের কন্ঠ</h2>
<div class="links">
<a class="g" href="http://ajkerkantho.net/" target="_blank"><i class="fas fa-globe"></i>Website</a>
<a class="y" href="https://www.youtube.com/@Ajkerkantho71" target="_blank"><i class="fab fa-youtube"></i>YouTube</a>
<a class="f" href="https://www.facebook.com/dainikajkerkanthoofficial2" target="_blank"><i class="fab fa-facebook"></i>Facebook Official</a>
<a class="f" href="https://www.facebook.com/dainikajkerkanthoofficial1" target="_blank"><i class="fab fa-facebook"></i>Facebook Backup</a>
<a class="i" href="https://www.instagram.com/ajker.kantho.71?igsh=MW04emdoNGZncTczdg==" target="_blank"><i class="fab fa-instagram"></i>Instagram</a>
<a class="x" href="https://x.com/ajkerkantho71" target="_blank"><i class="fab fa-x-twitter"></i>X</a>
<a class="gr" href="https://facebook.com/groups/695157524593827/" target="_blank"><i class="fas fa-users"></i>Official Group</a>
</div>
</div>

<div class="sec">
<h2>দৈনিক আজকের কন্ঠ ডিজিটাল</h2>
<div class="links">
<a class="y" href="https://youtube.com/channel/UC4ijRQpcZuhVCFsyUNqmD7Q?si=GX9r-tVBhfdVT6wz" target="_blank"><i class="fab fa-youtube"></i>YouTube</a>
<a class="f" href="https://www.facebook.com/AjkerKonthoDigital07" target="_blank"><i class="fab fa-facebook"></i>Facebook</a>
</div>
</div>
</div>
</div>
</body>
</html>
